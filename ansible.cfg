# OpsMind Ansible Configuration
# v0.1.0 - Optimized for discovery workflows

[defaults]
# Connection settings
host_key_checking = False
timeout = 10
gathering = smart
gather_subset = all
gather_timeout = 10

# Inventory settings
inventory = ./ansible/inventories/local.yml
deprecation_warnings = False
stdout_callback = yaml
callback_whitelist = profile_tasks

# Performance settings
forks = 10
pipelining = True
execution_strategy = linear
internal_poll_interval = 0.01

# Control path settings (SSH multiplexing)
control_path_dir = /tmp/.ansible-cp
control_path = %(directory)s/%%h-%%p-%%r
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no

# Logging
log_path = /tmp/opsmind-ansible.log

[ssh_connection]
# SSH optimization for discovery
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o ServerAliveInterval=30
scp_if_ssh = False
retries = 2

[persistent_connection]
# Persistent connection settings for network devices
connect_timeout = 10
command_timeout = 30

[inventory]
# Inventory settings
enable_plugins = host_list, script, auto, yaml, ini, toml
