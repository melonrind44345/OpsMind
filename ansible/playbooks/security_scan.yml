---
# OpsMind: Security Baseline Scan Playbook
# Security assessment and vulnerability scanning.
- name: OpsMind Security Scan
  hosts: all
  gather_facts: yes

  tasks:
    - name: Check firewall status
      ansible.builtin.shell:
        cmd: |
          if command -v ufw &>/dev/null; then ufw status
          elif command -v firewall-cmd &>/dev/null; then firewall-cmd --state
          elif command -v iptables &>/dev/null; then iptables -L -n | head -20
          else echo "no firewall detected"
          fi
      register: firewall_status
      ignore_errors: yes
      changed_when: no

    - name: Check SELinux status
      ansible.builtin.selinux:
      register: selinux_status
      ignore_errors: yes

    - name: Check SSH configuration
      ansible.builtin.shell:
        cmd: |
          grep -E "^(PermitRootLogin|PasswordAuthentication|Port) " /etc/ssh/sshd_config 2>/dev/null || echo "config not found"
      register: ssh_config
      ignore_errors: yes
      changed_when: no

    - name: Check for available security updates
      ansible.builtin.shell:
        cmd: |
          if command -v apt &>/dev/null; then apt list --upgradable 2>/dev/null | grep -i security | wc -l
          elif command -v yum &>/dev/null; then yum check-update --security 2>/dev/null | wc -l
          else echo "0"
          fi
      register: security_updates
      ignore_errors: yes
      changed_when: no

    - name: Find world-writable files
      ansible.builtin.shell:
        cmd: find /etc -type f -perm -o+w 2>/dev/null | head -20
      register: world_writable
      ignore_errors: yes
      changed_when: no

    - name: Check for users with empty passwords
      ansible.builtin.shell:
        cmd: awk -F: '($2 == "" || $2 == "!") {print $1}' /etc/shadow 2>/dev/null | head -10
      register: empty_password_users
      ignore_errors: yes
      changed_when: no

    - name: Save security scan results
      ansible.builtin.copy:
        content: |
          {
            "host": "{{ inventory_hostname }}",
            "firewall": {{ (firewall_status.stdout | default('')) | to_json }},
            "selinux": {{ selinux_status | default({}) | to_json }},
            "ssh_config": {{ (ssh_config.stdout | default('')) | to_json }},
            "security_updates": "{{ security_updates.stdout | default('0') | trim }}",
            "world_writable_files": {{ (world_writable.stdout_lines | default([])) | to_json }},
            "empty_password_users": {{ (empty_password_users.stdout_lines | default([])) | to_json }}
          }
        dest: "/tmp/opsmind_security_scan_{{ inventory_hostname }}.json"
      delegate_to: localhost
