name: Docker

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "src/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "src/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  docker:
    name: "Build & Scan Image"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Use the docker-container driver so the builder supports exporting
      # cache blobs to the GitHub Actions cache backend (type=gha).  The
      # default "docker" driver cannot export cache.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/opsmind
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: ${{ github.event_name == 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Disable provenance attestation unless you need SLSA — it adds build
          # time and has been known to cause intermittent buildx failures when
          # the builder environment doesn't support the attestation backend.
          provenance: false

      # Tag a short local alias for smoke tests and scanning (PR only — never pushed).
      - name: Tag image for local testing
        if: github.event_name == 'pull_request'
        run: |
          TAGS="${{ steps.meta.outputs.tags }}"
          FIRST_TAG=$(echo "$TAGS" | head -n1)
          echo "Tagging $FIRST_TAG → opsmind:ci-scan"
          docker tag "$FIRST_TAG" opsmind:ci-scan

      # Quick smoke test to catch entry-point failures before scanning.
      - name: Smoke test image
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm opsmind:ci-scan --version
          docker run --rm opsmind:ci-scan --help

      - name: Scan image with Trivy
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: opsmind:ci-scan
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "HIGH,CRITICAL"

      - name: Upload scan results
        if: github.event_name == 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
