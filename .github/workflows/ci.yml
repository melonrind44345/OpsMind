name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_DIR: src/opsmind
  COVERAGE_THRESHOLD: "48"

jobs:
  # ==========================================================================
  # Quality gate: lint + format + type check + security (parallel)
  # ==========================================================================
  quality:
    name: "Quality (${{ matrix.check }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [ruff-lint, ruff-format, mypy, bandit]
        include:
          - check: ruff-lint
            run: ruff check $PACKAGE_DIR/ tests/
          - check: ruff-format
            run: ruff format --check $PACKAGE_DIR/ tests/
          - check: mypy
            run: mypy $PACKAGE_DIR/
          - check: bandit
            run: bandit -r $PACKAGE_DIR/ -ll
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python CI
        uses: ./.github/actions/setup-python-ci
        with:
          python-version: "3.11"

      - name: Run ${{ matrix.check }}
        run: ${{ matrix.run }}

  # ==========================================================================
  # Test matrix: unit + integration tests across Python versions
  # ==========================================================================
  test:
    name: "Test (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python CI
        uses: ./.github/actions/setup-python-ci
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: >
          pytest tests/unit/
          -v
          --tb=short
          -m "not ansible"
          --junitxml=junit-unit-py${{ matrix.python-version }}.xml
          --cov=opsmind
          --cov-report=xml:coverage-unit-py${{ matrix.python-version }}.xml
          --cov-report=term
          --no-header

      - name: Run integration tests
        run: >
          pytest tests/integration/
          -v
          --tb=long
          --junitxml=junit-integration-py${{ matrix.python-version }}.xml
          --cov=opsmind
          --cov-append
          --cov-report=xml:coverage-integration-py${{ matrix.python-version }}.xml
          --cov-report=term
          --no-header

      - name: Rename coverage data for combining
        run: mv .coverage .coverage-py${{ matrix.python-version }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            junit-*.xml
            coverage-*.xml
            .coverage-py*
          retention-days: 7

  # ==========================================================================
  # Coverage aggregation and threshold check
  # ==========================================================================
  coverage:
    name: "Coverage Report"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python CI
        uses: ./.github/actions/setup-python-ci
        with:
          python-version: "3.11"

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          merge-multiple: true

      - name: Combine coverage data
        id: coverage
        run: |
          pip install coverage
          # Combine .coverage data files from all Python versions
          if ls .coverage-py* 1>/dev/null 2>&1; then
            coverage combine .coverage-py*
          else
            echo "WARNING: No .coverage data files found, generating report from XML..."
            coverage combine 2>/dev/null || true
          fi
          # Generate terminal report (fails if under threshold)
          coverage report --fail-under=${{ env.COVERAGE_THRESHOLD }} --show-missing
          # Generate HTML and JSON reports
          coverage html -d htmlcov
          coverage json -o coverage.json
          # Extract detailed metrics
          COV_PCT=$(python -c "import json; d=json.load(open('coverage.json'))['totals']; print(d['percent_covered'])")
          echo "cov_pct=${COV_PCT}" >> $GITHUB_OUTPUT
          echo "num_statements=$(python -c "import json; print(json.load(open('coverage.json'))['totals']['num_statements'])")" >> $GITHUB_OUTPUT
          echo "num_missing=$(python -c "import json; print(json.load(open('coverage.json'))['totals']['missing_lines'])")" >> $GITHUB_OUTPUT

      - name: Generate coverage badge data
        run: |
          python -c "
          import json
          data = json.load(open('coverage.json'))
          totals = data['totals']
          print(f'  Statements : {totals[\"num_statements\"]}')
          print(f'  Covered    : {totals[\"covered_lines\"]}')
          print(f'  Missing    : {totals[\"missing_lines\"]}')
          print(f'  Coverage   : {totals[\"percent_covered\"]:.1f}%')
          print(f'  Threshold  : ${{ env.COVERAGE_THRESHOLD }}%')
          print(f'  Status     : {\"PASS\" if totals[\"percent_covered\"] >= float(${{ env.COVERAGE_THRESHOLD }}) else \"FAIL\"}')
          "

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14

      - name: Upload coverage JSON
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: coverage.json
          retention-days: 30

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.json ]; then
            python -c "
          import json
          d = json.load(open('coverage.json'))['totals']
          pct = d['percent_covered']
          stmts = d['num_statements']
          miss = d['missing_lines']
          cov = d['covered_lines']
          threshold = float('\${{ env.COVERAGE_THRESHOLD }}')
          status = '✅' if pct >= threshold else '❌'
          print(f'### {status} Coverage: {pct:.1f}% (threshold: {threshold:.0f}%)', file=open('\$GITHUB_STEP_SUMMARY', 'a'))
          print(f'', file=open('\$GITHUB_STEP_SUMMARY', 'a'))
          print(f'| Metric | Value |', file=open('\$GITHUB_STEP_SUMMARY', 'a'))
          print(f'|--------|-------|', file=open('\$GITHUB_STEP_SUMMARY', 'a'))
          print(f'| Statements | {stmts} |', file=open('\$GITHUB_STEP_SUMMARY', 'a'))
          print(f'| Covered | {cov} |', file=open('\$GITHUB_STEP_SUMMARY', 'a'))
          print(f'| Missing | {miss} |', file=open('\$GITHUB_STEP_SUMMARY', 'a'))
          print(f'| Branch coverage | {d[\"percent_covered\"]:.1f}% |', file=open('\$GITHUB_STEP_SUMMARY', 'a'))
            "
          fi

  # ==========================================================================
  # Build check: verify package can be built
  # ==========================================================================
  build-check:
    name: "Build Check"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python CI
        uses: ./.github/actions/setup-python-ci
        with:
          python-version: "3.11"

      - name: Build package
        run: python -m build

      - name: Verify package
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
