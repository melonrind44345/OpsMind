name: Release

on:
  push:
    tags:
      - "v*.*.*"           # Semantic version tags (v1.2.3)

permissions:
  contents: write          # For creating GitHub Releases
  packages: write           # For pushing to GHCR
  id-token: write           # For PyPI OIDC trusted publishing
  attestations: write       # For artifact attestation

jobs:
  # ==========================================================================
  # Build packages
  # ==========================================================================
  build:
    name: "Build Packages"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python CI
        uses: ./.github/actions/setup-python-ci
        with:
          python-version: "3.11"

      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build package
        run: python -m build

      - name: Verify package
        run: twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ==========================================================================
  # Publish to PyPI via OIDC Trusted Publishing
  # ==========================================================================
  pypi-publish:
    name: "Publish to PyPI"
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/opsmind
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ==========================================================================
  # Build and push Docker image to GHCR
  # ==========================================================================
  docker:
    name: "Docker Image"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/opsmind
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use the built wheel for the Docker image
          build-args: |
            OPSMIND_VERSION=${{ needs.build.outputs.version }}

  # ==========================================================================
  # Create GitHub Release
  # ==========================================================================
  github-release:
    name: "GitHub Release"
    runs-on: ubuntu-latest
    needs: [build, pypi-publish]
    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Generate changelog
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          writeToFile: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: OpsMind ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changes }}
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
